name: Swing Scan (JP stocks)

# 日本株 現物の短期スイング買い候補を毎営業日の大引け後に抽出する。
# 金額(余力・許容損失)は公開リポジトリに書かず、Secrets から渡す:
#   Settings > Secrets and variables > Actions > New repository secret
#     SWING_CAPITAL   (例: 100000)
#     SWING_MAX_LOSS  (例: 5000)

on:
  schedule:
    - cron: '0 8 * * 1-5'    # 平日 17:00 JST（東証の大引け15:30と当日の決算開示の後）
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

concurrency:
  group: swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy xlrd openpyxl

      - name: Offline self-test
        run: python tests/test_swing_scan.py

      - name: Run swing scan
        env:
          SWING_CAPITAL: ${{ secrets.SWING_CAPITAL }}
          SWING_MAX_LOSS: ${{ secrets.SWING_MAX_LOSS }}
        run: python swing_scan.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/swing_candidates.json output/swing_log.csv universe_jp.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update swing scan [$(date '+%Y-%m-%d %H:%M JST')]"
            git pull --rebase origin main
            git push origin main
          fi
